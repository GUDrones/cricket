<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ODIN Device Mockup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div class="device-frame">
    <div class="device-screen">
      <div class="device-header">
        <span class="odin-logo">&#9678; ODIN</span>
        <div class="toggle-group">
          <button class="toggle-btn active">Automatic</button>
          <button class="toggle-btn manual">Manual <span class="dot"></span></button>
        </div>
        <span class="battery"></span>
      </div>
      <div class="device-grid">
        <div class="icon-box" style="top: 30%; left: 40%;"><span class="material-icons">directions_car</span></div>
        <div class="icon-box" style="top: 60%; left: 60%;"><span class="material-icons">local_shipping</span></div>
        <div class="icon-box" style="top: 30%; left: 70%;"><span class="material-icons">agriculture</span></div>
      </div>
    </div>
  </div>
  <div class="footer-text"><span class="dot"></span> Tap to interact</div>
  <script src="script.js"></script>
</body>
</html>
